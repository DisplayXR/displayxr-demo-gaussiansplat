name: Build Linux

# gaussiansplat Linux build-green dev loop (issue #60; recipe: the runtime repo's
# docs/guides/linux-demo-port.md).
#
# PROMOTED to a PR-triggered required check (DisplayXR/displayxr-runtime#722):
# runs on every PR like build-windows.yml / build-macos.yml, with the same
# DetectChanges docs_only short-circuit so doc-only PRs report success in
# seconds without building. Required context (main-protection ruleset):
# Build Linux (alongside Build Windows + Build macOS).
#
# Packaging gate: the "Linux Packaging" aggregator job (below) is the single
# required context for the Deb + DebInstall (Ubuntu 22.04 / 24.04 / 26.04)
# lane, so a .deb that installs but cannot run on a supported release blocks
# the merge, not just the release (runtime #1656 / #1684).
#
# Build-green scope: compile gaussian_splatting_handle_vk_linux on every
# supported release (tri-LTS matrix, aggregated into the required "Build Linux"
# context). CI has no display/GPU, so on-screen validation stays a separate
# pass; the DebInstall matrix does launch the installed package, but only to
# prove it gets past the dynamic loader.
#
# The Deb / DebInstall / DebRelease jobs make the packaged artifact portable
# across 22.04, 24.04 and 26.04 (runtime #1656): built on the oldest release,
# versioned Depends from dpkg-shlibdeps, and install-verified on all three
# before it can be attached to a release.

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - 'linux'
      - 'linux-**'
      - 'feature/linux-**'
    # Release tags: the Deb job attaches the demo .deb to the GitHub Release
    # (the Linux meta-bundle fetches it — runtime #781 Phase 3).
    tags:
      - 'v*'

# The Deb job attaches release assets on tags.
permissions:
  contents: write

# Cancel any in-progress run for the same PR (or branch) when a new
# push comes in. Only the latest commit's CI completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  DetectChanges:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full clone — the diff below uses pull_request.base.sha, which can
          # be older than the merge commit's first parent. Shallow clones miss
          # those refs and the diff fails with "fatal: bad object".
          fetch-depth: 0
      - id: filter
        run: |
          # Same docs_only rule as build-windows.yml: heavy jobs still RUN (to
          # report the required status) but skip their expensive steps.
          # workflow_dispatch always builds.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Detected non-PR trigger — docs_only=false"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected docs_only=$(grep ^docs_only= "$GITHUB_OUTPUT" | cut -d= -f2)"

  # TRI-LTS MATRIX (mirrors displayxr-demo-modelviewer): the deployment target
  # is Ubuntu 26.04, but 22.04 and 24.04 are supported releases too — the .deb
  # must install and run on all three (#1656 in the runtime), so all three
  # toolchains (GCC 11 / 13 / 15) are kept green here. 22.04/24.04 use hosted
  # runners; 26.04 runs in a container (no hosted 26.04 runner yet).
  Build:
    name: Build (Ubuntu ${{ matrix.lts }})
    needs: DetectChanges
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lts: "22.04"
            runner: ubuntu-22.04
          - lts: "24.04"
            runner: ubuntu-24.04
          - lts: "26.04"
            runner: ubuntu-latest
            container: ubuntu:26.04
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — reporting success without building."

      # In the 26.04 container we start as root with a bare image — install git
      # BEFORE checkout (which shells out to git). No-op on the hosted runners.
      - name: Bootstrap container (git for checkout)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          if [ "$(id -u)" = "0" ] && ! command -v git >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'

      # Base list (playbook) + this demo's specifics: glslang-tools for the
      # SPIR-V shader compile in 3dgs_common, zlib1g-dev for the Niantic SPZ
      # loader (else 3dgs_common FetchContent-fetches zlib). No FFmpeg — this
      # demo has none. The X11/Wayland/ALSA headers are here for the hosted-NULL
      # harness's future SDL window arm AND to keep the loader build consistent
      # with the sibling demos. libxxf86vm-dev + libxcb-glx0-dev: once GL/EGL
      # headers are present, OpenXR-SDK-Source flips on GLX platform support —
      # the loader includes <xcb/glx.h> and its gfxwrapper test helper links
      # Xxf86vm (the GLX-flip gotcha).
      #
      # SUDO shim so the same step works on hosted runners (non-root, has sudo)
      # and in the container (root, no sudo). Vendor-neutral libegl-dev/libgl-dev
      # so the names resolve across 22.04/24.04/26.04.
      - name: Install dependencies
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO=sudo
          $SUDO apt-get update
          DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y \
            build-essential cmake ninja-build pkg-config git ca-certificates curl python3 \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            zlib1g-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libdbus-1-dev libegl-dev libgl-dev libasound2-dev \
            libxxf86vm-dev libxcb-glx0-dev

      # Assert the SPIR-V + zlib toolchain is actually present (fail loudly, not
      # a hollow green): glslangValidator drives every 3dgs_common shader header.
      - name: Assert shader + zlib toolchain present
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          command -v glslangValidator >/dev/null || {
            echo "::error::glslangValidator not found — SPIR-V shader compile would fail"; exit 1; }
          pkg-config --exists zlib || {
            echo "::error::zlib not found via pkg-config — SPZ loader dependency missing"; exit 1; }

      - name: Build (build-green; app is not run — no display on CI)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: ./scripts/build_linux.sh

      # Guard against a hollow green: the binary must actually have been linked.
      # The Linux leg links the GRAPHICS splat renderer (GsAdrenoRenderer) —
      # linux/CMakeLists.txt sets GS_RENDERER=GRAPHICS, overriding
      # gs_renderer_select.h's desktop-x86_64 COMPUTE default. The graphics path
      # is not Android/Apple-Silicon-only; it also wins on immediate-mode GPUs.
      - name: Assert the demo binary linked
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          test -x build/linux/gaussian_splatting_handle_vk_linux || {
            echo "::error::gaussian_splatting_handle_vk_linux was not produced"; exit 1; }

  # Aggregate context. The main-protection ruleset requires the check "Build
  # Linux"; the matrix legs report as "Build (Ubuntu <lts>)", so this job keeps
  # the required context reporting and green only when EVERY leg passed. (The
  # alternative — switching the ruleset to the three per-leg contexts, as
  # displayxr-demo-modelviewer did — needs a repo-admin change, not a PR.)
  BuildLinux:
    name: Build Linux
    needs: Build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the tri-LTS matrix result
        run: |
          echo "Build matrix result: ${{ needs.Build.result }}"
          [ "${{ needs.Build.result }}" = "success" ] || {
            echo "::error::at least one Ubuntu leg failed"; exit 1; }

  # Build the ONE demo .deb — the asset the Linux meta-bundle fetches (runtime
  # #781 Phase 3; the bundle's glob expects exactly one). Runs on every PR too
  # so a broken package_deb_linux.sh is caught before release; DebRelease below
  # attaches it to a v* release once DebInstall has proved it.
  #
  # PORTABLE BY CONSTRUCTION (runtime #1656): the same .deb must install and run
  # on Ubuntu 22.04, 24.04 and 26.04, so it is built on the OLDEST — an
  # ubuntu:22.04 container (glibc 2.35 / GCC 11 floor). v1.27.1 was built on
  # ubuntu-latest (24.04), needed GLIBC_2.38 / GLIBCXX_3.4.32, and declared an
  # unversioned `libc6`, so apt installed it on 22.04 and the demo then died at
  # exec. package_deb_linux.sh now derives versioned Depends with
  # dpkg-shlibdeps, refuses a DT_NEEDED outside its cross-release STABLE_SONAMES
  # list, and — with DXR_DEB_MAX_GLIBC — refuses a glibc floor above 22.04's.
  #
  # Deliberately the bare image's apt cmake (3.22.1), not a downloaded Kitware
  # build: a hosted runner's modern CMake hides the repo's real floor
  # (cmake_minimum_required 3.21), so the container is what actually tests it.
  Deb:
    needs: DetectChanges
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DXR_DEB_MAX_GLIBC: "2.35" # Ubuntu 22.04 — the oldest supported release
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — skipping .deb build."

      # Bare image, root: git before checkout (else checkout falls back to a
      # tarball with no tags and git describe cannot version the .deb).
      - name: Bootstrap container (git for checkout)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          fetch-depth: 0 # git describe needs tags for the .deb version

      # Same list as the Build matrix + the packaging tools (dpkg-dev provides
      # dpkg-deb and dpkg-shlibdeps; binutils provides objdump for the
      # DT_NEEDED / symbol-version scan; fakeroot for the root-owned payload).
      - name: Install dependencies
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 file binutils \
            libvulkan-dev glslang-tools \
            zlib1g-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libdbus-1-dev libegl-dev libgl-dev libasound2-dev \
            libxxf86vm-dev libxcb-glx0-dev \
            dpkg-dev fakeroot
          cmake --version | head -1

      - name: Build + package the demo .deb
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/package_deb_linux.sh
          ls -lh dist/*.deb

      - name: Upload .deb artifact
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: displayxr-gaussiansplat-deb
          path: dist/*.deb
          if-no-files-found: error

  # Install the .deb from the Deb job into a PRISTINE container of every
  # supported release, together with the latest released runtime .deb (the demo
  # Depends on displayxr-runtime), and exercise it there
  # (scripts/verify_deb_install_linux.sh): apt must resolve Depends from that
  # release's archive without Recommends, `ldd -r` must be clean on every
  # shipped ELF, every Depends/Recommends/Suggests name must exist there, the
  # launcher must get past the dynamic loader, and `displayxr-cli selftest` must
  # pass env-free on the packaged sim-display.
  DebInstall:
    name: DebInstall (Ubuntu ${{ matrix.lts }})
    needs: [DetectChanges, Deb]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lts: ["22.04", "24.04", "26.04"]
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — no .deb to verify."

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'

      - uses: actions/download-artifact@v4
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          name: displayxr-gaussiansplat-deb
          path: dist

      - name: Fetch the latest released runtime .deb
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo DisplayXR/displayxr-runtime \
            --pattern 'displayxr-runtime_*_amd64.deb' --dir runtime-deb
          ls runtime-deb

      - name: apt install + ldd -r + launch smoke in clean ubuntu:${{ matrix.lts }}
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          docker run --rm -v "$PWD:/w" -w /w "ubuntu:${{ matrix.lts }}" \
            ./scripts/verify_deb_install_linux.sh \
              dist/displayxr-gaussiansplat_*_amd64.deb runtime-deb/*.deb

  # Single stable required context for the whole Linux packaging lane —
  # "Linux Packaging" (mirrors displayxr-runtime's, PR #1684).
  #
  # Why an aggregator rather than requiring the legs directly: DebInstall is a
  # matrix, so its contexts are "DebInstall (Ubuntu 22.04)", "… 24.04",
  # "… 26.04" — names that change the moment a release is added or dropped, and
  # a ruleset still demanding a context no job produces blocks every PR forever.
  # This job's name is fixed, so the matrix can grow or shrink freely.
  #
  # The gap it closes: DebInstall proves the .deb installs AND runs on every
  # supported release, but nothing stopped a PR MERGING with it red — the
  # runtime #1656 shape (a .deb that apt installs on 22.04 and that then fails
  # at exec / dlopen) was only caught at release time, if at all.
  #
  # Doc-only PRs: Deb / DebInstall still RUN on the docs_only path and skip
  # every step, so this job's needs are satisfied and it reports success in
  # seconds without asserting anything.
  #
  # `if: always()` is load-bearing: without it a failed leg would SKIP this job,
  # and a skipped check counts as green for a required context — the aggregator
  # would silently stop gating exactly when it matters.
  LinuxPackaging:
    name: Linux Packaging
    needs: [DetectChanges, Deb, DebInstall]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — packaging legs short-circuited; reporting success without asserting."

      - name: Assert every packaging leg succeeded
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          # DetectChanges is included on purpose: if it failed, docs_only is ''
          # (!= 'true'), so we land here — and must fail rather than green-light
          # a run whose change classification never happened.
          RESULT_DETECTCHANGES: ${{ needs.DetectChanges.result }}
          RESULT_DEB: ${{ needs.Deb.result }}
          # Matrix job: 'success' only when every leg succeeded (fail-fast is
          # off, so one red release still surfaces here).
          RESULT_DEBINSTALL: ${{ needs.DebInstall.result }}
        run: |
          set -u
          rc=0
          for leg in DETECTCHANGES DEB DEBINSTALL; do
            var="RESULT_${leg}"
            result="${!var}"
            printf '%-14s %s\n' "$leg" "${result:-<missing>}"
            # Anything that is not an outright success fails the gate —
            # including 'skipped', which on the non-docs_only path can only
            # mean a leg was bypassed by a condition it should not have been.
            [ "$result" = "success" ] || rc=1
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::Linux packaging lane is not green — see the leg results above."
            exit 1
          fi
          echo "All Linux packaging legs succeeded."

  # Attach the .deb to the GitHub Release on a v* tag — only once DebInstall has
  # proved it on every supported release (a non-portable package can no longer
  # be published).
  DebRelease:
    needs: [DetectChanges, Deb, DebInstall]
    if: needs.DetectChanges.outputs.docs_only != 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: displayxr-gaussiansplat-deb
          path: dist

      - name: Attach .deb to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          fail_on_unmatched_files: true
