name: lint

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vendor-name guard
        run: |
          # Enforces the DisplayXR vendor-neutrality contract: authored files must
          # not self-brand with the display vendor's company name. The literal is
          # constructed at runtime so this workflow does not itself contain it.
          #
          # Excluded paths:
          #   .git, .claude       - not authored product content
          #   openxr/             - OpenXR extension headers vendored VERBATIM from
          #                         displayxr-runtime; they carry upstream's copyright
          #                         line and must match byte-for-byte.
          #   displayxr-common    - policed in its own repo (submodule / FetchContent).
          #   CHANGELOG.md        - historical record; may name the original vendor SDK.
          #   CLAUDE.md           - documents the DisplayXR org, which legitimately
          #                         names the vendor plug-in repo by its published name.
          #
          # Tier-A allowlist (ALLOW): legitimate names of the vendor hardware /
          # plug-in / SDK / OEM the ecosystem integrates with - like naming NVIDIA in
          # CUDA code. A line containing any of these tokens is permitted.
          FORBIDDEN="le""ia"
          ALLOW='cnsdk|leia_cnsdk|libdxrp050_leia_cnsdk|leiasdk|leiasr|displayxr-leia|leia-plugin|leiaplugin|leia_plugin|leia_tag|leia-sr|leia sr|leia hardware|leia display|leia dp|leia android dp|leia sdk|leia plug|leia panel|leia weave|leia face|leia viewer|leia-viewer|leia convention|leia lif|leia heif|leia image format|leiaschema|classic leia|leialoft|leiainc/|com.leia.|com\.leia\.\*|LEIA_EXE|LEIA_VER|LEIA_TAG|SecLeia|G_Leia|LeiaUnrealSDK|LeiaPlayerWin'
          hits=$(grep -rniI \
                   --exclude-dir=.git --exclude-dir=.claude \
                   --exclude-dir=openxr --exclude-dir=displayxr-common \
                   --exclude=CHANGELOG.md --exclude=CLAUDE.md \
                   "$FORBIDDEN" . | grep -viE "$ALLOW" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Vendor company name found in authored files (not covered by the Tier-A allowlist). Neutralize it, or add a legitimate hardware/plug-in token to ALLOW."
            exit 1
          fi
          echo "OK: no non-allowlisted vendor-name references in authored files."

      - name: Vendored OpenXR headers match their pinned runtime commits
        run: |
          # displayxr-demo-mediaplayer#61: the vendored DisplayXR extension
          # headers are this repo's ONLY coupling to the runtime, and their
          # provenance used to be unverifiable prose. VENDORED.json now pins each
          # header to a full runtime commit SHA; this proves the bytes match.
          python3 scripts/check_vendored_headers.py --drift

      - name: Colour swapchain format is chosen _SRGB-first on every leg (INV-4.6)
        run: |
          # The splat renderers produce DISPLAY-REFERRED bytes. Since runtime
          # v2.21.7 (#1589) an UNORM swapchain is read as LINEAR and sRGB-encoded
          # on the way to the panel, so those bytes in an UNORM swapchain come out
          # washed out. The Android leg preferred {R8G8B8A8_UNORM, B8G8R8A8_UNORM}
          # through v1.29.0 while the desktop legs had moved to _SRGB — nothing
          # noticed until a tablet eyeball. Every leg that enumerates swapchain
          # formats must pick through the one shared rule,
          # gsChooseSwapchainFormat (3dgs_common/gs_vulkan_utils.h). The Windows
          # leg picks through displayxr-common (dxr::ChooseColorSwapchainFormat).
          fail=0
          for f in $(git ls-files 'android/*.cpp' 'linux/*.cpp' 'macos/*.mm' 'macos/*.cpp'); do
            if grep -q 'xrEnumerateSwapchainFormats(' "$f" && ! grep -q 'gsChooseSwapchainFormat(' "$f"; then
              echo "::error file=$f::enumerates swapchain formats but does not choose through gsChooseSwapchainFormat (INV-4.6)"
              fail=1
            fi
          done
          # A colour-format preference list that names only UNORM formats.
          hits=$(git ls-files '*.cpp' '*.mm' '*.h' | xargs grep -nE '[{][[:space:]]*VK_FORMAT_[RB]8G8[RB]8A8_UNORM[[:space:]]*,[[:space:]]*VK_FORMAT_[RB]8G8[RB]8A8_UNORM[[:space:]]*[}]' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::UNORM-only swapchain format preference list — display-referred bytes in it are encoded twice (INV-4.6)"
            fail=1
          fi
          [ $fail -eq 0 ] && echo "OK: every leg chooses its colour swapchain _SRGB-first."
          exit $fail

      - name: Workflow YAML is valid
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]"
